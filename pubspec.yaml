name: agenticfrontend
description: "Agentic Frontend — hybrid Supabase + FastAPI Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.2.0

  # DI
  get_it: ^7.7.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1
  web_socket_channel: ^3.0.1

  # Supabase
  supabase_flutter: ^2.8.0

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.5.0

  # Environment
  flutter_dotenv: ^5.2.1

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  lottie: ^3.3.1

  # Utils
  intl: ^0.20.2
  logger: ^2.5.0
  uuid: ^4.5.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    # NOTE: .env is loaded from the project root at runtime via flutter_dotenv.
    # Do NOT list .env here — it embeds secrets into the compiled binary.
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/placeholders/
    - assets/images/illustrations/
    - assets/images/backgrounds/
    - assets/icons/nav/
    - assets/icons/custom/
    - assets/lottie/
